spring.application.name=eindopdracht

spring.datasource.url=jdbc:postgresql://localhost:5432/eindopdracht
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=true
client-id=DagKompas-backend
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/DagKompas
spring.security.oauth2.resourceserver.jwt.audiences=account
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
keycloak.server-url=http://localhost:9090
keycloak.realm=DagKompas
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}